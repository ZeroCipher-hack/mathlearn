<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathLearn — Kirish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }
        .logo-area {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-area .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(233,69,96,0.4);
        }
        .logo-area h1 {
            color: white;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .logo-area p {
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            margin-top: 5px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
        }
        .role-tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
        }
        .role-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            color: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 500;
            border: none;
            background: transparent;
        }
        .role-tab.active {
            background: linear-gradient(135deg, #e94560, #c23152);
            color: white;
            box-shadow: 0 4px 15px rgba(233,69,96,0.4);
        }
        .form-label {
            color: rgba(255,255,255,0.8);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .input-group {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .input-group:focus-within {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.15);
        }
        .input-group-text {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.4);
            padding: 12px 16px;
        }
        .form-control {
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px 12px 0;
            font-size: 15px;
        }
        .form-control:focus {
            background: transparent;
            color: white;
            box-shadow: none;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(233,69,96,0.4);
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(233,69,96,0.5);
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
        .register-link a {
            color: #e94560;
            text-decoration: none;
            font-weight: 600;
        }
        .alert {
            border-radius: 12px;
            border: none;
            background: rgba(233,69,96,0.2);
            color: #ff6b81;
            font-size: 14px;
            padding: 12px 16px;
        }
        .math-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .math-symbol {
            position: absolute;
            color: rgba(255,255,255,0.03);
            font-size: 60px;
            font-weight: 700;
            animation: float 8s infinite ease-in-out;
        }
        @keyframes float {
            0%,100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        .login-wrapper { position: relative; z-index: 1; }
    </style>
</head>
<body>

<!-- Matematik fon -->
<div class="math-bg">
    <span class="math-symbol" style="top:10%;left:5%;animation-delay:0s">∑</span>
    <span class="math-symbol" style="top:20%;left:85%;animation-delay:1s">π</span>
    <span class="math-symbol" style="top:60%;left:10%;animation-delay:2s">∫</span>
    <span class="math-symbol" style="top:70%;left:80%;animation-delay:3s">√</span>
    <span class="math-symbol" style="top:40%;left:50%;animation-delay:4s">∞</span>
    <span class="math-symbol" style="top:85%;left:30%;animation-delay:1.5s">Δ</span>
    <span class="math-symbol" style="top:5%;left:45%;animation-delay:2.5s">θ</span>
    <span class="math-symbol" style="top:50%;left:90%;animation-delay:0.5s">α</span>
</div>

<div class="login-wrapper">
    <!-- Logo -->
    <div class="logo-area">
        <div class="logo-icon">∑</div>
        <h1>MathLearn</h1>
        <p>Matematikani o'rganishning eng yaxshi yo'li</p>
    </div>

    <!-- Karta -->
    <div class="card">
        <!-- Rol tanlash -->
        <div class="role-tabs">
            <button class="role-tab active" onclick="setRole('student', this)">
                <i class="fas fa-user-graduate me-2"></i>O'quvchi
            </button>
            <button class="role-tab" onclick="setRole('teacher', this)">
                <i class="fas fa-chalkboard-teacher me-2"></i>O'qituvchi
            </button>
        </div>

        <!-- Xabar -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert mb-3">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form -->
        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="role" id="selectedRole" value="student">

            <div class="mb-3">
                <label class="form-label">Foydalanuvchi nomi</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control"
                           placeholder="username kiriting" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Parol</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control"
                           placeholder="parol kiriting" required id="passwordField">
                    <span class="input-group-text" style="cursor:pointer"
                          onclick="togglePassword()">
                        <i class="fas fa-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>Kirish
            </button>
        </form>

        <div class="register-link">
            Hisobingiz yo'qmi?
            <a href="{% url 'register' %}">Ro'yxatdan o'ting</a>
        </div>
    </div>
</div>

<script>
function setRole(role, btn) {
    document.getElementById('selectedRole').value = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
}

function togglePassword() {
    const field = document.getElementById('passwordField');
    const icon = document.getElementById('eyeIcon');
    if (field.type === 'password') {
        field.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        field.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
</body>
</html>
