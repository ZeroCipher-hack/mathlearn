<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish — MathLearn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { min-height:100vh; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); display:flex; align-items:center; justify-content:center; font-family:'Segoe UI',sans-serif; padding:20px; }
        .card { background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); border-radius:24px; padding:40px; width:100%; max-width:520px; position:relative; z-index:1; }
        .logo { text-align:center; margin-bottom:30px; }
        .logo-icon { width:60px; height:60px; background:linear-gradient(135deg,#e94560,#0f3460); border-radius:16px; display:inline-flex; align-items:center; justify-content:center; font-size:28px; color:white; margin-bottom:12px; }
        .logo h2 { color:white; font-weight:700; margin:0; }
        .logo p { color:rgba(255,255,255,0.5); font-size:13px; }
        .role-tabs { display:flex; background:rgba(255,255,255,0.05); border-radius:12px; padding:4px; margin-bottom:24px; }
        .role-tab { flex:1; text-align:center; padding:9px; border-radius:10px; color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.3s; font-size:13px; font-weight:500; border:none; background:transparent; }
        .role-tab.active { background:linear-gradient(135deg,#e94560,#c23152); color:white; }
        .form-label { color:rgba(255,255,255,0.8); font-size:13px; font-weight:500; margin-bottom:6px; display:block; }
        .input-group { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; transition:all 0.3s; margin-bottom:16px; }
        .input-group:focus-within { border-color:#e94560; }
        .input-group-text { background:transparent; border:none; color:rgba(255,255,255,0.4); padding:10px 14px; }
        .form-control { background:transparent; border:none; color:white; padding:10px 14px 10px 0; font-size:14px; }
        .form-control:focus { background:transparent; color:white; box-shadow:none; }
        .form-control::placeholder { color:rgba(255,255,255,0.3); }
        .btn-register { width:100%; padding:13px; background:linear-gradient(135deg,#e94560,#c23152); border:none; border-radius:12px; color:white; font-size:15px; font-weight:600; margin-top:8px; transition:all 0.3s; }
        .btn-register:hover { transform:translateY(-2px); }
        .login-link { text-align:center; margin-top:16px; color:rgba(255,255,255,0.5); font-size:13px; }
        .login-link a { color:#e94560; text-decoration:none; font-weight:600; }
        .alert { border-radius:10px; border:none; background:rgba(233,69,96,0.2); color:#ff6b81; font-size:13px; }
        .teacher-code-box { background:rgba(255,215,0,0.08); border:1px solid rgba(255,215,0,0.3); border-radius:12px; padding:16px; margin-bottom:16px; display:none; }
        .teacher-code-box .form-label { color:rgba(255,215,0,0.9); }
        .math-bg { position:fixed; top:0; left:0; width:100%; height:100%; overflow:hidden; z-index:0; pointer-events:none; }
        .math-symbol { position:absolute; color:rgba(255,255,255,0.03); font-size:60px; font-weight:700; animation:float 8s infinite ease-in-out; }
        @keyframes float { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-20px) rotate(10deg)} }
    </style>
</head>
<body>
<div class="math-bg">
    <span class="math-symbol" style="top:10%;left:5%;">∑</span>
    <span class="math-symbol" style="top:70%;left:85%;animation-delay:2s">π</span>
    <span class="math-symbol" style="top:40%;left:10%;animation-delay:1s">∫</span>
    <span class="math-symbol" style="top:20%;left:80%;animation-delay:3s">√</span>
    <span class="math-symbol" style="top:60%;left:50%;animation-delay:1.5s">∞</span>
</div>

<div class="card">
    <div class="logo">
        <div class="logo-icon">∑</div>
        <h2>MathLearn</h2>
        <p>Yangi hisob yaratish</p>
    </div>

    {% if messages %}
        {% for message in messages %}
        <div class="alert mb-3"><i class="fas fa-exclamation-circle me-2"></i>{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="role-tabs">
        <button class="role-tab active" onclick="setRole('student',this)">
            <i class="fas fa-user-graduate me-1"></i>O'quvchi
        </button>
        <button class="role-tab" onclick="setRole('teacher',this)">
            <i class="fas fa-chalkboard-teacher me-1"></i>O'qituvchi
        </button>
    </div>

    <form method="POST">
        {% csrf_token %}
        <input type="hidden" name="role" id="selectedRole" value="student">

        <div class="row g-0">
            <div class="col-6 pe-2">
                <label class="form-label">Ism</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="first_name" class="form-control" placeholder="Ismingiz">
                </div>
            </div>
            <div class="col-6 ps-2">
                <label class="form-label">Familiya</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="last_name" class="form-control" placeholder="Familiyangiz">
                </div>
            </div>
        </div>

        <label class="form-label">Foydalanuvchi nomi *</label>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-at"></i></span>
            <input type="text" name="username" class="form-control" placeholder="username" required>
        </div>

        <label class="form-label">Email</label>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" name="email" class="form-control" placeholder="email@mail.com">
        </div>

        <label class="form-label">Parol *</label>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" name="password1" class="form-control" placeholder="Parol" required>
        </div>

        <label class="form-label">Parolni tasdiqlang *</label>
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" name="password2" class="form-control" placeholder="Parolni qaytaring" required>
        </div>

        <!-- O'qituvchi maxsus kodi -->
        <div class="teacher-code-box" id="teacherCodeBox">
            <label class="form-label">
                <i class="fas fa-key me-2"></i>O'qituvchi maxsus kodi *
            </label>
            <div class="input-group">
                <span class="input-group-text"><i class="fas fa-shield-alt"></i></span>
                <input type="text" name="teacher_code" id="teacherCodeInput"
                       class="form-control" placeholder="Markaz bergan maxsus kodni kiriting">
            </div>
            <small style="color:rgba(255,215,0,0.7);font-size:12px;">
                <i class="fas fa-info-circle me-1"></i>
                Bu kodni markaz ma'muriyatidan olishingiz mumkin
            </small>
        </div>

        <button type="submit" class="btn-register">
            <i class="fas fa-user-plus me-2"></i>Ro'yxatdan o'tish
        </button>
    </form>

    <div class="login-link">
        Hisobingiz bormi? <a href="{% url 'login' %}">Kirish</a>
    </div>
</div>

<script>
function setRole(role, btn) {
    document.getElementById('selectedRole').value = role;
    document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');

    const codeBox = document.getElementById('teacherCodeBox');
    const codeInput = document.getElementById('teacherCodeInput');
    if (role === 'teacher') {
        codeBox.style.display = 'block';
        codeInput.required = true;
    } else {
        codeBox.style.display = 'none';
        codeInput.required = false;
        codeInput.value = '';
    }
}
</script>
</body>
</html>
